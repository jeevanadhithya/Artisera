name: mobile
description: "Artisera Flutter Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  share_plus: ^10.1.4
  http: ^1.3.0
  http_parser: ^4.1.2
  shared_preferences: ^2.5.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  app_links: ^6.3.2
  intl: ^0.20.2
  google_fonts: ^8.2.1
  record: ^7.1.1
  path_provider: ^2.1.6
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo.png
